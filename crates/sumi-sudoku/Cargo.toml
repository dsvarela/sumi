[package]
name = "sumi-sudoku"
version = "0.1.0"
description = "A calm terminal Sudoku game that teaches"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sumi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
rand = "0.10.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sumi-core = { path = "../sumi-core", version = "0.1.0" }
toml = "1.1.7"
toml_edit = "0.25.16"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.11.0"
