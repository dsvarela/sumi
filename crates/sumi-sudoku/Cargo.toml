[package]
name = "sumi-sudoku"
version = "0.1.0"
description = "A calm terminal Sudoku game that teaches"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sumi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
ratatui = "0.30.2"
sumi-core = { path = "../sumi-core", version = "0.1.0" }

[dev-dependencies]
insta = "1.49.0"
