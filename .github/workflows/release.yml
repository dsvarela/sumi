name: Release

# A v* tag naming the crates' version is tested, builds sumi for each
# platform, and drafts a GitHub release with the archives and their
# checksums. The draft is published by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag names every crate's version
        run: |
          for version in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version'); do
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME, but a crate is at $version"
              exit 1
            fi
          done
      - run: cargo test --workspace --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static binaries, so one file runs on any Linux. The aarch64
          # one is also the Termux build. `name` is what the archive is
          # called by.
          - target: x86_64-unknown-linux-musl
            name: x86_64-linux
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            name: aarch64-linux
            os: ubuntu-latest
            rustflags: -C linker=rust-lld
          - target: aarch64-apple-darwin
            name: aarch64-macos
            os: macos-latest
          - target: x86_64-apple-darwin
            name: x86_64-macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p sumi-sudoku --target ${{ matrix.target }}
      - name: Package
        env:
          # Keeps macOS tar from adding ._ files for extended attributes.
          COPYFILE_DISABLE: 1
        run: |
          name="sumi-$GITHUB_REF_NAME-${{ matrix.name }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/sumi" LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: sumi-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum sumi-*.tar.gz > SHA256SUMS
      # A run done again replaces the files of the draft it made before.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "sumi $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" --clobber sumi-*.tar.gz SHA256SUMS
